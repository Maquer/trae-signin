name: TRAE 每日签到

on:
  schedule:
    - cron: '0 0 * * *' # 00:00 UTC = 08:00 北京时间
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trae-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        id: gen
        env:
          AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
          AUTH_3: ${{ secrets.TRAE_AUTH_3 }}
        run: |
          set -e
          mkdir -p auths
          COUNT=0
          if [ -n "$AUTH_1" ]; then printf '%s' "$AUTH_1" > auths/trae-1.json; COUNT=$((COUNT+1)); fi
          if [ -n "$AUTH_2" ]; then printf '%s' "$AUTH_2" > auths/trae-2.json; COUNT=$((COUNT+1)); fi
          if [ -n "$AUTH_3" ]; then printf '%s' "$AUTH_3" > auths/trae-3.json; COUNT=$((COUNT+1)); fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::未配置任何账号 Secret（TRAE_AUTH_1/2/3），已跳过签到"
            echo "no_accounts=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_accounts=false" >> "$GITHUB_OUTPUT"
            ls -la auths
          fi

      - name: 执行签到
        if: steps.gen.outputs.no_accounts != 'true'
        continue-on-error: true
        run: |
          set +e

          echo "🔄 尝试 1/2..."
          OUTPUT=$(./signin_bin auths 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          # 检查是否有签到失败或程序异常退出
          FAIL_COUNT=$(printf '%s' "$OUTPUT" | grep -oE '失败=[0-9]+' | grep -oE '[0-9]+' | head -1)

          if [ "${FAIL_COUNT:-0}" -gt 0 ] || [ "$EXIT_CODE" -ne 0 ]; then
            echo "⚠️ 失败=${FAIL_COUNT:-?} 退出码=${EXIT_CODE}，30 秒后重试..."
            sleep 30
            echo "🔄 尝试 2/2..."
            OUTPUT=$(./signin_bin auths 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"
          fi

          set -e
          echo "SIGNIN_OUTPUT<<EOF" >> "$GITHUB_ENV"
          echo "$OUTPUT" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          exit "$EXIT_CODE"

      - name: 提取结果
        id: result
        if: steps.gen.outputs.no_accounts != 'true'
        run: |
          TOTAL=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '总计=[0-9]+' | grep -oE '[0-9]+' | head -1)
          OK=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '签到成功=[0-9]+' | grep -oE '[0-9]+' | head -1)
          ALREADY=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '已签=[0-9]+' | grep -oE '[0-9]+' | head -1)
          FAIL=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '失败=[0-9]+' | grep -oE '[0-9]+' | head -1)
          SIGNIN=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '累计签到奖励=[0-9]+' | grep -oE '[0-9]+' | head -1)
          REMAIN=$(printf '%s' "$SIGNIN_OUTPUT" | grep -oE '总剩余=[0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "total=${TOTAL:-?}" >> "$GITHUB_OUTPUT"
          echo "ok=${OK:-?}" >> "$GITHUB_OUTPUT"
          echo "already=${ALREADY:-?}" >> "$GITHUB_OUTPUT"
          echo "fail=${FAIL:-?}" >> "$GITHUB_OUTPUT"
          echo "signin=${SIGNIN:-?}" >> "$GITHUB_OUTPUT"
          echo "remain=${REMAIN:-?}" >> "$GITHUB_OUTPUT"

          # Job Summary
          {
            echo "## TRAE 签到结果"
            echo ""
            echo "| 指标 | 值 |"
            echo "|------|------|"
            echo "| 总计 | ${TOTAL:-?} |"
            echo "| 签到成功 | ${OK:-?} |"
            echo "| 已签 | ${ALREADY:-?} |"
            echo "| 失败 | ${FAIL:-?} |"
            echo "| 累计签到奖励 | ${SIGNIN:-?} |"
            echo "| 总剩余 | ${REMAIN:-?} |"
            echo ""
            echo "<details><summary>完整输出</summary>"
            echo ""
            echo '```'
            echo "$SIGNIN_OUTPUT"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bark 通知
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          NO_ACCOUNTS: ${{ steps.gen.outputs.no_accounts }}
          TOTAL: ${{ steps.result.outputs.total }}
          OK: ${{ steps.result.outputs.ok }}
          ALREADY: ${{ steps.result.outputs.already }}
          FAIL: ${{ steps.result.outputs.fail }}
          SIGNIN: ${{ steps.result.outputs.signin }}
          REMAIN: ${{ steps.result.outputs.remain }}
        run: |
          set -e
          if [ -z "$BARK_URL" ]; then echo "未配置 BARK_URL，跳过"; exit 0; fi
          if [ "$NO_ACCOUNTS" = "true" ]; then
            TITLE="⚠️ TRAE 未配置账号"
            BODY="请到仓库 Settings → Secrets and variables → Actions 配置 TRAE_AUTH_1/2/3"
          else
            TITLE="✅ TRAE 签到"
            if [ "${FAIL:-0}" -gt 0 ] 2>/dev/null; then TITLE="⚠️ TRAE 签到异常"; fi
            BODY="总计${TOTAL:-?} 成功${OK:-?} 已签${ALREADY:-?} 失败${FAIL:-?} 签到奖励${SIGNIN:-?} 剩余${REMAIN:-?}"
          fi
          TITLE_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$TITLE")
          BODY_ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$BODY")
          curl -s --max-time 15 -X POST "${BARK_URL}/${TITLE_ENC}/${BODY_ENC}" || true

      - name: 清理凭证
        if: always()
        run: rm -rf auths
